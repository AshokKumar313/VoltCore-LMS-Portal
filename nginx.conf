# ========================================================================================
# VoltCore Apex Academia - Nginx Reverse Proxy Configuration
# Anna University / MIT Campus Standards (Department of Electronics Engineering)
# ========================================================================================

server {
    listen 80;
    server_name localhost voltcore.mitindia.edu;

    # Root for pre-built Astro static site
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for Low Bandwidth
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Assets Caching
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # REST Telemetry API Reverse Proxy to Flask Service
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Static Page Fallback
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

