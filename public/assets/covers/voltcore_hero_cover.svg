<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vhc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="45%" stop-color="#041226" />
      <stop offset="85%" stop-color="#020813" />
      <stop offset="100%" stop-color="#01040a" />
    </linearGradient>

    <!-- Metallic Brushed Gold Gradient -->
    <linearGradient id="vhc-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FFD45E" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Luminous Emerald Gradient -->
    <linearGradient id="vhc-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0B5" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00693E" />
    </linearGradient>

    <!-- Oscilloscope Grid Pattern -->
    <pattern id="vhc-scope-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0B5" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="0.75" fill="#38BDF8" fill-opacity="0.2" />
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="vhc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" fill="url(#vhc-bg)" />

  <!-- Oscilloscope Background Graticule Grid -->
  <rect width="1200" height="400" fill="url(#vhc-scope-grid)" />

  <!-- Ambient Glow Cones -->
  <circle cx="150" cy="180" r="280" fill="#00F0B5" opacity="0.06" filter="url(#vhc-glow)" />
  <circle cx="1050" cy="200" r="260" fill="#38BDF8" opacity="0.05" filter="url(#vhc-glow)" />
  <circle cx="600" cy="50" r="200" fill="#F59E0B" opacity="0.04" filter="url(#vhc-glow)" />

  <!-- Top / Bottom Silicon Micro-Bus Accents -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#vhc-emerald)" stroke-width="2.5" opacity="0.8" />
  <line x1="0" y1="398" x2="1200" y2="398" stroke="url(#vhc-gold)" stroke-width="2.5" opacity="0.8" />

  <!-- PCB Copper Trace Geometry - Left Flank -->
  <g stroke="#00F0B5" stroke-width="1.8" fill="none" opacity="0.45" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0,80 L 140,80 L 180,120 L 320,120 L 350,150 L 420,150" />
    <path d="M 0,140 L 90,140 L 130,180 L 220,180 L 250,210 L 310,210" />
    <path d="M 0,260 L 120,260 L 160,220 L 280,220 L 310,250 L 400,250" />
    <path d="M 0,320 L 160,320 L 200,280 L 340,280 L 370,310 L 450,310" />
  </g>

  <!-- Left Solder Vias -->
  <g fill="#F59E0B" opacity="0.7">
    <circle cx="140" cy="80" r="3.5" />
    <circle cx="320" cy="120" r="3.5" />
    <circle cx="420" cy="150" r="4.5" fill="#00F0B5" />
    <circle cx="220" cy="180" r="3.5" />
    <circle cx="310" cy="210" r="4.5" fill="#00F0B5" />
    <circle cx="280" cy="220" r="3.5" />
    <circle cx="400" cy="250" r="4.5" fill="#00F0B5" />
    <circle cx="340" cy="280" r="3.5" />
    <circle cx="450" cy="310" r="4.5" fill="#00F0B5" />
  </g>

  <!-- PCB Copper Trace Geometry - Right Flank -->
  <g stroke="#38BDF8" stroke-width="1.8" fill="none" opacity="0.45" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1200,80 L 1060,80 L 1020,120 L 880,120 L 850,150 L 780,150" />
    <path d="M 1200,140 L 1110,140 L 1070,180 L 980,180 L 950,210 L 890,210" />
    <path d="M 1200,260 L 1080,260 L 1040,220 L 920,220 L 890,250 L 800,250" />
    <path d="M 1200,320 L 1040,320 L 1000,280 L 860,280 L 830,310 L 750,310" />
  </g>

  <!-- Right Solder Vias -->
  <g fill="#F59E0B" opacity="0.7">
    <circle cx="1060" cy="80" r="3.5" />
    <circle cx="880" cy="120" r="3.5" />
    <circle cx="780" cy="150" r="4.5" fill="#38BDF8" />
    <circle cx="980" cy="180" r="3.5" />
    <circle cx="890" cy="210" r="4.5" fill="#38BDF8" />
    <circle cx="920" cy="220" r="3.5" />
    <circle cx="800" cy="250" r="4.5" fill="#38BDF8" />
    <circle cx="860" cy="280" r="3.5" />
    <circle cx="750" cy="310" r="4.5" fill="#38BDF8" />
  </g>

  <!-- Oscilloscope Sine Wave Across Center Canvas -->
  <path d="M 0,200 Q 75,130 150,200 T 300,200 T 450,200 T 600,200 T 750,200 T 900,200 T 1050,200 T 1200,200"
        fill="none" stroke="url(#vhc-emerald)" stroke-width="2.5" opacity="0.35" />

  <!-- Modulated Carrier Wave Stream -->
  <path d="M 150,200 Q 187,170 225,200 T 300,200 T 375,200 T 450,200 T 525,200 T 600,200 T 675,200 T 750,200 T 825,200 T 900,200 T 975,200 T 1050,200"
        fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.25" stroke-dasharray="6 3" />

  <!-- Right Celestial Celestial Engineering Orbital Rings -->
  <g transform="translate(1040, 200)" opacity="0.5">
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#vhc-gold)" stroke-width="1.5" stroke-dasharray="10 6" />
    <circle cx="0" cy="0" r="105" fill="none" stroke="#00F0B5" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="0" cy="0" r="6" fill="#F59E0B" />
    <!-- Orbiting Satellite Nodes -->
    <circle cx="74" cy="-74" r="4" fill="#00F0B5" />
    <circle cx="-105" cy="0" r="4" fill="#38BDF8" />
    <circle cx="0" cy="140" r="4.5" fill="#F59E0B" />
  </g>

  <!-- Central Academic Typography & Crest Shield -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- Center Emblem Shield Icon (Miniature Master Crest) -->
    <g transform="translate(0, -95)">
      <path d="M 0,-36 C 26,-36 38,-26 38,-2 C 38,26 12,42 0,50 C -12,42 -38,26 -38,-2 C -38,-26 -26,-36 0,-36 Z"
            fill="#020813" stroke="url(#vhc-emerald)" stroke-width="2.5" />
      <polygon points="4,-20 -6,2 2,2 -4,22 8,-2 0,-2" fill="url(#vhc-gold)" />
      <circle cx="0" cy="-28" r="2.5" fill="#FFE885" />
    </g>

    <!-- Top Institution Line -->
    <text y="-14" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700"
          letter-spacing="5" fill="#38BDF8" opacity="0.9">
      MADRAS INSTITUTE OF TECHNOLOGY CAMPUS • ANNA UNIVERSITY
    </text>

    <!-- Primary Brand Title -->
    <text y="30" font-family="'Manrope', 'Inter', -apple-system, sans-serif" font-size="40" font-weight="900"
          letter-spacing="2" fill="#FFFFFF">
      VOLT<tspan fill="#00F0B5">CORE</tspan> <tspan fill="url(#vhc-gold)">APEX ACADEMIA</tspan>
    </text>

    <!-- Department & Specialization Line -->
    <text y="58" font-family="'Manrope', 'Inter', sans-serif" font-size="13" font-weight="700"
          letter-spacing="3" fill="#94A3B8">
      DEPARTMENT OF ELECTRONICS ENGINEERING • REGULATION 2023
    </text>

    <!-- Academic Institutional Motto Banner -->
    <g transform="translate(0, 86)">
      <rect x="-240" y="-12" width="480" height="24" rx="12" fill="#020813" stroke="url(#vhc-gold)" stroke-width="1.2" opacity="0.9" />
      <text y="4" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600"
            letter-spacing="2" fill="url(#vhc-gold)">
        ENGINEERING INTELLIGENCE • PRACTICAL INNOVATION • ACADEMIC EXCELLENCE
      </text>
    </g>
  </g>
</svg>