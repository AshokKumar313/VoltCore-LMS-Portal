<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="digGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="50%" stop-color="#031C33" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <pattern id="digGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <filter id="digGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#digGrad)" />
  <rect width="800" height="400" fill="url(#digGrid)" />

  <circle cx="240" cy="190" r="150" fill="#38BDF8" opacity="0.05" filter="url(#digGlow)" />
  <circle cx="640" cy="180" r="160" fill="#0284C7" opacity="0.06" filter="url(#digGlow)" />

  <!-- Digital Clock Waveform Trace -->
  <g stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.85" filter="url(#digGlow)">
    <path d="M 50 140 L 110 140 L 110 90 L 170 90 L 170 140 L 230 140 L 230 90 L 290 90 L 290 140 L 350 140 L 350 90 L 410 90 L 410 140" />
    <path d="M 50 200 L 140 200 L 150 160 L 300 160 L 310 200 L 410 200" stroke="#00F0B5" stroke-width="2" />
    <path d="M 50 260 L 190 260 L 200 220 L 370 220 L 380 260 L 410 260" stroke="#818CF8" stroke-width="2" />
  </g>

  <!-- Signal Labels -->
  <g font-family="monospace" font-size="11" font-weight="bold" fill="#94A3B8">
    <text x="50" y="80" fill="#38BDF8">CLK (100 MHz)</text>
    <text x="50" y="180" fill="#00F0B5">DATA_IN [D]</text>
    <text x="50" y="240" fill="#818CF8">OUTPUT [Q]</text>
  </g>

  <!-- CMOS Inverter & Silicon Layout Schematic Overlay -->
  <g transform="translate(490, 80)" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.8">
    <!-- VDD Rail -->
    <line x1="40" y1="20" x2="200" y2="20" stroke-width="2.5" />
    <text x="210" y="24" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">V_DD</text>

    <!-- PMOS Transistor -->
    <line x1="120" y1="20" x2="120" y2="55" />
    <line x1="95" y1="55" x2="95" y2="95" stroke-width="3" />
    <circle cx="85" cy="75" r="4" stroke="#38BDF8" />
    <line x1="60" y1="75" x2="81" y2="75" />
    <line x1="120" y1="55" x2="105" y2="55" />
    <line x1="120" y1="95" x2="105" y2="95" />
    <line x1="120" y1="95" x2="120" y2="135" />

    <!-- Output Junction -->
    <circle cx="120" cy="115" r="3" fill="#38BDF8" />
    <line x1="120" y1="115" x2="190" y2="115" stroke-width="2.5" />
    <circle cx="190" cy="115" r="3.5" fill="#38BDF8" />
    <text x="200" y="119" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">Y = !A</text>

    <!-- NMOS Transistor -->
    <line x1="120" y1="135" x2="120" y2="175" />
    <line x1="95" y1="135" x2="95" y2="175" stroke-width="3" />
    <line x1="60" y1="155" x2="95" y2="155" />
    <line x1="120" y1="135" x2="105" y2="135" />
    <line x1="120" y1="175" x2="105" y2="175" />
    <line x1="120" y1="175" x2="120" y2="210" />

    <!-- Input Rail Connection -->
    <line x1="60" y1="75" x2="60" y2="155" />
    <line x1="20" y1="115" x2="60" y2="115" stroke-width="2.5" />
    <circle cx="20" cy="115" r="3.5" fill="#38BDF8" />
    <text x="5" y="119" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">A</text>

    <!-- GND Rail -->
    <line x1="100" y1="210" x2="140" y2="210" stroke-width="2.5" />
    <line x1="108" y1="215" x2="132" y2="215" stroke-width="1.5" />
    <line x1="116" y1="220" x2="124" y2="220" stroke-width="1" />
  </g>

  <!-- Static Timing Analysis Equations -->
  <g opacity="0.5" font-family="monospace" font-size="11" fill="#94A3B8">
    <text x="60" y="300">T_clk ≥ t_cq + t_comb + t_setup</text>
    <text x="60" y="322">t_hold ≤ t_cq + t_comb_min</text>
  </g>

  <!-- Editorial Domain Badge -->
  <g transform="translate(60, 345)">
    <rect width="250" height="36" rx="10" fill="#041026" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="22" cy="18" r="6" fill="#38BDF8" opacity="0.8" />
    <text x="38" y="22" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">DIGITAL &amp; VLSI SYSTEMS</text>
  </g>
</svg>