<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="anGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="50%" stop-color="#06231B" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0B5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="anGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0B5" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <filter id="anGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="800" height="400" fill="url(#anGrad)" />
  <rect width="800" height="400" fill="url(#anGrid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="180" r="160" fill="#00F0B5" opacity="0.06" filter="url(#anGlow)" />
  <circle cx="620" cy="220" r="140" fill="#10B981" opacity="0.05" filter="url(#anGlow)" />

  <!-- Shockley Diode Exponential Curve Trace -->
  <path d="M 50 340 L 260 340 Q 320 338 360 290 Q 390 220 410 70" fill="none" stroke="#00F0B5" stroke-width="2.5" opacity="0.85" filter="url(#anGlow)" />
  <path d="M 50 340 L 450 340" stroke="#64748B" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
  <path d="M 280 370 L 280 50" stroke="#64748B" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />

  <!-- BJT Common-Emitter Bias Schematic Overlay -->
  <g transform="translate(480, 80)" stroke="#00F0B5" stroke-width="2" fill="none" opacity="0.75">
    <!-- Supply Rail -->
    <line x1="20" y1="20" x2="240" y2="20" stroke-width="2.5" />
    <circle cx="20" cy="20" r="3" fill="#00F0B5" />
    <text x="248" y="24" fill="#00F0B5" font-family="monospace" font-size="12" font-weight="bold">+V_CC</text>

    <!-- Collector Resistor Rc -->
    <path d="M 160 20 L 160 50 L 155 55 L 165 65 L 155 75 L 165 85 L 160 90 L 160 120" />
    <text x="175" y="75" fill="#94A3B8" font-family="monospace" font-size="10">R_C</text>

    <!-- Transistor Core -->
    <circle cx="140" cy="140" r="28" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <line x1="120" y1="120" x2="120" y2="160" stroke-width="3" stroke="#00F0B5" />
    <!-- Collector Branch -->
    <line x1="120" y1="130" x2="160" y2="120" />
    <!-- Emitter Branch with Arrow -->
    <line x1="120" y1="150" x2="160" y2="170" />
    <polygon points="152,163 160,170 148,171" fill="#00F0B5" stroke="none" />

    <!-- Emitter Resistor Re -->
    <path d="M 160 170 L 160 190 L 155 195 L 165 205 L 155 215 L 165 225 L 160 230 L 160 250" />
    <text x="175" y="215" fill="#94A3B8" font-family="monospace" font-size="10">R_E</text>

    <!-- Ground Symbol -->
    <line x1="150" y1="250" x2="170" y2="250" stroke-width="2" />
    <line x1="154" y1="254" x2="166" y2="254" stroke-width="1.5" />
    <line x1="158" y1="258" x2="162" y2="258" stroke-width="1" />
  </g>

  <!-- Small Signal Hybrid-Pi Equation Vector Text -->
  <g opacity="0.5" font-family="monospace" font-size="11" fill="#94A3B8">
    <text x="60" y="80">g_m = I_C / V_T ≈ 38.5 · I_C (mA)</text>
    <text x="60" y="105">r_π = β / g_m = β · V_T / I_C</text>
    <text x="60" y="130">I_C = I_S · [exp(V_BE / V_T) - 1]</text>
  </g>

  <!-- Editorial Engineering Domain Watermark Badge -->
  <g transform="translate(60, 310)">
    <rect width="260" height="36" rx="10" fill="#041026" stroke="#00F0B5" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="22" cy="18" r="6" fill="#00F0B5" opacity="0.8" />
    <text x="38" y="22" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">ANALOG &amp; DEVICES STUDIO</text>
  </g>
</svg>