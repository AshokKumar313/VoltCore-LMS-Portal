<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="50%" stop-color="#210817" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <pattern id="ctrlGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F43F5E" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <filter id="ctrlGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#ctrlGrad)" />
  <rect width="800" height="400" fill="url(#ctrlGrid)" />

  <circle cx="200" cy="180" r="150" fill="#F43F5E" opacity="0.05" filter="url(#ctrlGlow)" />
  <circle cx="620" cy="190" r="160" fill="#6366F1" opacity="0.06" filter="url(#ctrlGlow)" />

  <!-- Feedback Control Loop Block Diagram Overlay -->
  <g transform="translate(60, 100)" stroke="#F43F5E" stroke-width="2" fill="none" opacity="0.85" filter="url(#ctrlGlow)">
    <!-- Reference Input R(s) -->
    <line x1="0" y1="40" x2="60" y2="40" stroke-width="2.5" />
    <polygon points="56,36 64,40 56,44" fill="#F43F5E" stroke="none" />
    <text x="5" y="30" fill="#F43F5E" font-family="monospace" font-size="12" font-weight="bold">R(s)</text>

    <!-- Summing Junction -->
    <circle cx="80" cy="40" r="16" stroke-width="2" />
    <line x1="72" y1="40" x2="88" y2="40" />
    <line x1="80" y1="32" x2="80" y2="48" />
    <text x="62" y="34" fill="#F43F5E" font-family="monospace" font-size="10">+</text>
    <text x="76" y="66" fill="#F43F5E" font-family="monospace" font-size="10">-</text>

    <!-- Line to Controller -->
    <line x1="96" y1="40" x2="140" y2="40" />
    <polygon points="136,36 144,40 136,44" fill="#F43F5E" stroke="none" />
    <text x="104" y="30" fill="#94A3B8" font-family="monospace" font-size="10">E(s)</text>

    <!-- Controller Block Gc(s) -->
    <rect x="144" y="16" width="68" height="48" rx="6" fill="#041026" stroke="#F43F5E" stroke-width="2" />
    <text x="156" y="44" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">G_c(s)</text>

    <!-- Line to Plant -->
    <line x1="212" y1="40" x2="260" y2="40" />
    <polygon points="256,36 264,40 256,44" fill="#F43F5E" stroke="none" />

    <!-- Plant Block G(s) -->
    <rect x="264" y="16" width="68" height="48" rx="6" fill="#041026" stroke="#6366F1" stroke-width="2" />
    <text x="282" y="44" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">G(s)</text>

    <!-- Output Y(s) -->
    <line x1="332" y1="40" x2="420" y2="40" stroke-width="2.5" />
    <polygon points="414,36 422,40 414,44" fill="#6366F1" stroke="none" />
    <circle cx="360" cy="40" r="3" fill="#6366F1" />
    <text x="400" y="30" fill="#6366F1" font-family="monospace" font-size="12" font-weight="bold">Y(s)</text>

    <!-- Feedback Branch H(s) -->
    <line x1="360" y1="40" x2="360" y2="120" />
    <line x1="360" y1="120" x2="268" y2="120" />
    <polygon points="274,116 266,120 274,124" fill="#F43F5E" stroke="none" />

    <!-- Feedback Sensor H(s) -->
    <rect x="198" y="96" width="68" height="48" rx="6" fill="#041026" stroke="#F43F5E" stroke-width="2" />
    <text x="216" y="124" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">H(s)</text>

    <line x1="198" y1="120" x2="80" y2="120" />
    <line x1="80" y1="120" x2="80" y2="56" />
    <polygon points="76,62 80,54 84,62" fill="#F43F5E" stroke="none" />
  </g>

  <!-- Electromagnetic Wave S-Plane Propagation Overlay -->
  <g transform="translate(540, 100)" stroke="#6366F1" stroke-width="1.5" opacity="0.75">
    <!-- s-plane -->
    <line x1="0" y1="20" x2="180" y2="20" stroke="#64748B" stroke-dasharray="2 2" />
    <line x1="90" y1="-40" x2="90" y2="140" stroke="#64748B" stroke-dasharray="2 2" />
    <text x="185" y="24" fill="#94A3B8" font-family="monospace" font-size="10">σ</text>
    <text x="85" y="-45" fill="#94A3B8" font-family="monospace" font-size="10">jω</text>
    <!-- Poles (X) -->
    <text x="35" y="0" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="bold">×</text>
    <text x="35" y="60" fill="#F43F5E" font-family="monospace" font-size="14" font-weight="bold">×</text>
    <!-- Root locus line -->
    <path d="M 40 -5 C 20 20, 20 20, 40 45" fill="none" stroke="#F43F5E" stroke-width="2" />
  </g>

  <!-- Maxwell & Transfer Function Equations -->
  <g opacity="0.5" font-family="monospace" font-size="11" fill="#94A3B8">
    <text x="60" y="310">T(s) = Y(s) / R(s) = [G_c(s) · G(s)] / [1 + G_c(s) · G(s) · H(s)]</text>
    <text x="60" y="332">∇ × E = -∂B/∂t,   ∇ × H = J + ∂D/∂t</text>
  </g>

  <!-- Editorial Domain Badge -->
  <g transform="translate(60, 350)">
    <rect width="300" height="36" rx="10" fill="#041026" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="22" cy="18" r="6" fill="#F43F5E" opacity="0.8" />
    <text x="38" y="22" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">CONTROL &amp; ELECTROMAGNETICS</text>
  </g>
</svg>