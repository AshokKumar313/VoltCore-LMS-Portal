<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="50%" stop-color="#240733" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <pattern id="commGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A855F7" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <filter id="commGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#commGrad)" />
  <rect width="800" height="400" fill="url(#commGrid)" />

  <circle cx="200" cy="180" r="160" fill="#A855F7" opacity="0.05" filter="url(#commGlow)" />
  <circle cx="600" cy="200" r="150" fill="#EC4899" opacity="0.05" filter="url(#commGlow)" />

  <!-- 16-QAM Constellation Signal Space Overlay -->
  <g transform="translate(180, 180)" stroke="#A855F7" stroke-width="1.5" opacity="0.85">
    <!-- Axes -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#64748B" stroke-dasharray="3 3" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#64748B" stroke-dasharray="3 3" />
    <text x="125" y="4" fill="#94A3B8" font-family="monospace" font-size="11">I</text>
    <text x="-6" y="-125" fill="#94A3B8" font-family="monospace" font-size="11">Q</text>

    <!-- Constellation Points Grid with Noise Dispersion Circles -->
    <!-- -3, -1, +1, +3 -->
    <g fill="#A855F7" stroke="none">
      <!-- Quadrant 1 -->
      <circle cx="30" cy="-30" r="4" /><circle cx="30" cy="-30" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="90" cy="-30" r="4" /><circle cx="90" cy="-30" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="30" cy="-90" r="4" /><circle cx="30" cy="-90" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="90" cy="-90" r="4" /><circle cx="90" cy="-90" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />

      <!-- Quadrant 2 -->
      <circle cx="-30" cy="-30" r="4" /><circle cx="-30" cy="-30" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="-90" cy="-30" r="4" /><circle cx="-90" cy="-30" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="-30" cy="-90" r="4" /><circle cx="-30" cy="-90" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="-90" cy="-90" r="4" /><circle cx="-90" cy="-90" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />

      <!-- Quadrant 3 -->
      <circle cx="-30" cy="30" r="4" /><circle cx="-30" cy="30" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="-90" cy="30" r="4" /><circle cx="-90" cy="30" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="-30" cy="90" r="4" /><circle cx="-30" cy="90" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="-90" cy="90" r="4" /><circle cx="-90" cy="90" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />

      <!-- Quadrant 4 -->
      <circle cx="30" cy="30" r="4" /><circle cx="30" cy="30" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="90" cy="30" r="4" /><circle cx="90" cy="30" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="30" cy="90" r="4" /><circle cx="30" cy="90" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
      <circle cx="90" cy="90" r="4" /><circle cx="90" cy="90" r="10" stroke="#A855F7" fill="none" stroke-width="1" opacity="0.4" />
    </g>
  </g>

  <!-- Modulated Carrier Waveform Overlay -->
  <g transform="translate(420, 80)" stroke="#EC4899" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 0 60 Q 25 0, 50 60 T 100 60 T 150 60 T 200 60 T 250 60 T 300 60" />
    <path d="M 0 140 Q 15 100, 30 140 T 60 140 T 90 140 T 120 140 T 160 140 T 200 140 T 240 140 T 280 140 T 300 140" stroke="#A855F7" stroke-width="1.5" />
    <text x="310" y="64" fill="#EC4899" font-family="monospace" font-size="11">s_QPSK(t)</text>
    <text x="310" y="144" fill="#A855F7" font-family="monospace" font-size="11">Carrier f_c</text>
  </g>

  <!-- Shannon-Hartley Capacity Formulation -->
  <g opacity="0.5" font-family="monospace" font-size="11" fill="#94A3B8">
    <text x="420" y="270">C = B · log_2(1 + SNR)</text>
    <text x="420" y="292">BER_QPSK ≈ Q(√(2·E_b / N_0))</text>
  </g>

  <!-- Editorial Domain Badge -->
  <g transform="translate(60, 345)">
    <rect width="270" height="36" rx="10" fill="#041026" stroke="#A855F7" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="22" cy="18" r="6" fill="#A855F7" opacity="0.8" />
    <text x="38" y="22" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">COMMUNICATIONS &amp; RF STUDIO</text>
  </g>
</svg>