<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="dspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="50%" stop-color="#211802" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <pattern id="dspGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <filter id="dspGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#dspGrad)" />
  <rect width="800" height="400" fill="url(#dspGrid)" />

  <circle cx="200" cy="180" r="150" fill="#F59E0B" opacity="0.05" filter="url(#dspGlow)" />
  <circle cx="620" cy="200" r="140" fill="#10B981" opacity="0.05" filter="url(#dspGlow)" />

  <!-- Discrete-Time Sinc Stem Waveform -->
  <g stroke="#F59E0B" stroke-width="2" opacity="0.85" filter="url(#dspGlow)">
    <line x1="40" y1="200" x2="420" y2="200" stroke="#64748B" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
    <!-- Stems -->
    <line x1="60" y1="200" x2="60" y2="195" /><circle cx="60" cy="195" r="2.5" fill="#F59E0B" />
    <line x1="90" y1="200" x2="90" y2="208" /><circle cx="90" cy="208" r="2.5" fill="#F59E0B" />
    <line x1="120" y1="200" x2="120" y2="180" /><circle cx="120" cy="180" r="2.5" fill="#F59E0B" />
    <line x1="150" y1="200" x2="150" y2="225" /><circle cx="150" cy="225" r="3" fill="#F59E0B" />
    <line x1="180" y1="200" x2="180" y2="150" /><circle cx="180" cy="150" r="3.5" fill="#F59E0B" />
    <line x1="210" y1="200" x2="210" y2="260" /><circle cx="210" cy="260" r="4" fill="#F59E0B" />
    <line x1="240" y1="200" x2="240" y2="80" stroke-width="3" stroke="#00F0B5" /><circle cx="240" cy="80" r="5" fill="#00F0B5" />
    <line x1="270" y1="200" x2="270" y2="260" /><circle cx="270" cy="260" r="4" fill="#F59E0B" />
    <line x1="300" y1="200" x2="300" y2="150" /><circle cx="300" cy="150" r="3.5" fill="#F59E0B" />
    <line x1="330" y1="200" x2="330" y2="225" /><circle cx="330" cy="225" r="3" fill="#F59E0B" />
    <line x1="360" y1="200" x2="360" y2="180" /><circle cx="360" cy="180" r="2.5" fill="#F59E0B" />
    <line x1="390" y1="200" x2="390" y2="208" /><circle cx="390" cy="208" r="2.5" fill="#F59E0B" />
  </g>

  <!-- Continuous Analog Envelope Overlay -->
  <path d="M 40 200 C 100 215, 140 130, 180 230 C 200 270, 220 80, 240 80 C 260 80, 280 270, 300 230 C 340 130, 380 215, 420 200" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.4" />

  <!-- Radix-2 FFT Butterfly Structure Overlay -->
  <g transform="translate(480, 70)" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.8">
    <text x="0" y="24" fill="#F59E0B" font-family="monospace" font-size="12">x(0)</text>
    <text x="0" y="94" fill="#F59E0B" font-family="monospace" font-size="12">x(1)</text>
    <text x="0" y="164" fill="#F59E0B" font-family="monospace" font-size="12">x(2)</text>
    <text x="0" y="234" fill="#F59E0B" font-family="monospace" font-size="12">x(3)</text>

    <!-- Butterfly 1 -->
    <line x1="40" y1="20" x2="160" y2="20" />
    <line x1="40" y1="90" x2="160" y2="90" />
    <line x1="40" y1="20" x2="160" y2="90" stroke-dasharray="4 2" stroke="#10B981" />
    <line x1="40" y1="90" x2="160" y2="20" stroke-dasharray="4 2" stroke="#10B981" />
    <circle cx="160" cy="20" r="3" fill="#F59E0B" />
    <circle cx="160" cy="90" r="3" fill="#F59E0B" />

    <!-- Butterfly 2 -->
    <line x1="40" y1="160" x2="160" y2="160" />
    <line x1="40" y1="230" x2="160" y2="230" />
    <line x1="40" y1="160" x2="160" y2="230" stroke-dasharray="4 2" stroke="#10B981" />
    <line x1="40" y1="230" x2="160" y2="160" stroke-dasharray="4 2" stroke="#10B981" />
    <circle cx="160" cy="160" r="3" fill="#F59E0B" />
    <circle cx="160" cy="230" r="3" fill="#F59E0B" />

    <!-- Twiddle Factor Labels -->
    <text x="180" y="24" fill="#00F0B5" font-family="monospace" font-size="11">X(0)</text>
    <text x="180" y="94" fill="#00F0B5" font-family="monospace" font-size="11">X(1) · W_4^1</text>
    <text x="180" y="164" fill="#00F0B5" font-family="monospace" font-size="11">X(2)</text>
    <text x="180" y="234" fill="#00F0B5" font-family="monospace" font-size="11">X(3) · W_4^3</text>
  </g>

  <!-- Discrete Fourier Transform Formula Text -->
  <g opacity="0.5" font-family="monospace" font-size="11" fill="#94A3B8">
    <text x="60" y="300">X[k] = Σ x[n] · exp(-j 2π k n / N)</text>
    <text x="60" y="322">H(z) = (Σ b_k z^-k) / (1 + Σ a_k z^-k)</text>
  </g>

  <!-- Editorial Domain Badge -->
  <g transform="translate(60, 345)">
    <rect width="250" height="36" rx="10" fill="#041026" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="22" cy="18" r="6" fill="#F59E0B" opacity="0.8" />
    <text x="38" y="22" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">SIGNALS &amp; DSP STUDIO</text>
  </g>
</svg>