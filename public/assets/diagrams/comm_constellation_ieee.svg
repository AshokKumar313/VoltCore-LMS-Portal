<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #020813; }
      .grid { stroke: #1e293b; stroke-width: 0.8; stroke-dasharray: 2 2; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .boundary { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .sym-point { fill: #00F0B5; stroke: #ffffff; stroke-width: 1.5; }
      .cloud { fill: #00F0B5; fill-opacity: 0.15; }
      .label-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .label-sub { font-family: 'Inter', sans-serif; font-size: 10px; fill: #94a3b8; }
      .label-axis { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94a3b8; }
      .label-sym { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #38bdf8; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="720" height="360" rx="16" class="bg" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="24" y="16" width="672" height="42" rx="8" fill="#041026" stroke="#00F0B5" stroke-width="0.8" stroke-opacity="0.3" />
  <circle cx="44" cy="37" r="5" fill="#00F0B5" />
  <text x="58" y="41" class="label-title">IEEE Standard 16-QAM Constellation &amp; Shannon-Hartley Capacity Space</text>
  <text x="670" y="41" text-anchor="end" class="label-sub" fill="#00F0B5">Anna University AU-R2023 • EC23C08 Comm Systems</text>

  <!-- Constellation Center: x=220, y=190. Radius scale = 35px per unit -->
  <!-- Main In-Phase (I) & Quadrature (Q) Axes -->
  <line x1="80" y1="190" x2="360" y2="190" class="axis" />
  <line x1="220" y1="70" x2="220" y2="310" class="axis" />
  <!-- Arrows -->
  <polygon points="360,187 367,190 360,193" fill="#64748b" />
  <polygon points="217,70 220,63 223,70" fill="#64748b" />
  <text x="360" y="205" class="label-axis" text-anchor="end">In-Phase (I)</text>
  <text x="230" y="75" class="label-axis">Quadrature (Q)</text>

  <!-- Unit Reference Circle -->
  <circle cx="220" cy="190" r="105" fill="none" stroke="#334155" stroke-dasharray="3 3" stroke-width="1" />

  <!-- Decision Boundaries: x = 220 +/- 35, y = 190 +/- 35 -->
  <line x1="185" y1="75" x2="185" y2="305" class="boundary" />
  <line x1="255" y1="75" x2="255" y2="305" class="boundary" />
  <line x1="85" y1="155" x2="355" y2="155" class="boundary" />
  <line x1="85" y1="225" x2="355" y2="225" class="boundary" />

  <!-- 16-QAM Constellation Points & Noise Clouds -->
  <!-- Coordinates: I in {-3, -1, +1, +3} * 35, Q in {+3, +1, -1, -3} * 35 -->
  <!-- Row 1: Q = +3 (y = 190 - 105 = 85) -->
  <circle cx="115" cy="85" r="14" class="cloud" />
  <circle cx="115" cy="85" r="4.5" class="sym-point" />
  <text x="115" y="75" text-anchor="middle" class="label-sym">0000</text>

  <circle cx="185" cy="85" r="14" class="cloud" />
  <circle cx="185" cy="85" r="4.5" class="sym-point" />
  <text x="185" y="75" text-anchor="middle" class="label-sym">0001</text>

  <circle cx="255" cy="85" r="14" class="cloud" />
  <circle cx="255" cy="85" r="4.5" class="sym-point" />
  <text x="255" y="75" text-anchor="middle" class="label-sym">0011</text>

  <circle cx="325" cy="85" r="14" class="cloud" />
  <circle cx="325" cy="85" r="4.5" class="sym-point" />
  <text x="325" y="75" text-anchor="middle" class="label-sym">0010</text>

  <!-- Row 2: Q = +1 (y = 190 - 35 = 155) -->
  <circle cx="115" cy="155" r="14" class="cloud" />
  <circle cx="115" cy="155" r="4.5" class="sym-point" />
  <text x="115" y="145" text-anchor="middle" class="label-sym">0100</text>

  <circle cx="185" cy="155" r="14" class="cloud" />
  <circle cx="185" cy="155" r="4.5" class="sym-point" />
  <text x="185" y="145" text-anchor="middle" class="label-sym">0101</text>

  <circle cx="255" cy="155" r="14" class="cloud" />
  <circle cx="255" cy="155" r="4.5" class="sym-point" />
  <text x="255" y="145" text-anchor="middle" class="label-sym">0111</text>

  <circle cx="325" cy="155" r="14" class="cloud" />
  <circle cx="325" cy="155" r="4.5" class="sym-point" />
  <text x="325" y="145" text-anchor="middle" class="label-sym">0110</text>

  <!-- Row 3: Q = -1 (y = 190 + 35 = 225) -->
  <circle cx="115" cy="225" r="14" class="cloud" />
  <circle cx="115" cy="225" r="4.5" class="sym-point" />
  <text x="115" y="243" text-anchor="middle" class="label-sym">1100</text>

  <circle cx="185" cy="225" r="14" class="cloud" />
  <circle cx="185" cy="225" r="4.5" class="sym-point" />
  <text x="185" y="243" text-anchor="middle" class="label-sym">1101</text>

  <circle cx="255" cy="225" r="14" class="cloud" />
  <circle cx="255" cy="225" r="4.5" class="sym-point" />
  <text x="255" y="243" text-anchor="middle" class="label-sym">1111</text>

  <circle cx="325" cy="225" r="14" class="cloud" />
  <circle cx="325" cy="225" r="4.5" class="sym-point" />
  <text x="325" y="243" text-anchor="middle" class="label-sym">1110</text>

  <!-- Row 4: Q = -3 (y = 190 + 105 = 295) -->
  <circle cx="115" cy="295" r="14" class="cloud" />
  <circle cx="115" cy="295" r="4.5" class="sym-point" />
  <text x="115" y="313" text-anchor="middle" class="label-sym">1000</text>

  <circle cx="185" cy="295" r="14" class="cloud" />
  <circle cx="185" cy="295" r="4.5" class="sym-point" />
  <text x="185" y="313" text-anchor="middle" class="label-sym">1001</text>

  <circle cx="255" cy="295" r="14" class="cloud" />
  <circle cx="255" cy="295" r="4.5" class="sym-point" />
  <text x="255" y="313" text-anchor="middle" class="label-sym">1011</text>

  <circle cx="325" cy="295" r="14" class="cloud" />
  <circle cx="325" cy="295" r="4.5" class="sym-point" />
  <text x="325" y="313" text-anchor="middle" class="label-sym">1010</text>

  <!-- Right Panel: Shannon Capacity Curve Plot -->
  <rect x="400" y="75" width="296" height="235" rx="10" fill="#041026" stroke="#1e293b" />
  <text x="415" y="96" class="label-title" font-size="11" fill="#38bdf8">Shannon Channel Capacity Bound</text>
  <text x="415" y="112" class="label-sub">C = B &times; log2(1 + SNR) [Bits/sec]</text>

  <!-- Mini axes in right panel -->
  <line x1="430" y1="270" x2="670" y2="270" stroke="#475569" stroke-width="1.2" />
  <line x1="430" y1="270" x2="430" y2="130" stroke="#475569" stroke-width="1.2" />
  <text x="670" y="285" class="label-axis" text-anchor="end" font-size="9">SNR (dB)</text>
  <text x="425" y="125" class="label-axis" font-size="9">C / B (bps/Hz)</text>

  <!-- Grid marks -->
  <text x="430" y="282" class="label-axis" font-size="8">0</text>
  <text x="510" y="282" class="label-axis" font-size="8">10</text>
  <text x="590" y="282" class="label-axis" font-size="8">20</text>
  <text x="660" y="282" class="label-axis" font-size="8">30</text>

  <!-- Shannon logarithmic curve -->
  <!-- SNR_dB: 0dB -> SNR=1 -> C/B = 1 (y=250), 10dB -> SNR=10 -> C/B=3.46 (y=210), 20dB -> SNR=100 -> C/B=6.66 (y=165), 30dB -> SNR=1000 -> C/B=9.97 (y=135) -->
  <path d="M 430 252 Q 510 205 590 165 T 665 135" fill="none" stroke="#00F0B5" stroke-width="2.5" />

  <!-- Operating point marker at 20dB SNR -->
  <circle cx="590" cy="165" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
  <line x1="590" y1="165" x2="590" y2="270" stroke="#f59e0b" stroke-dasharray="2 2" stroke-width="1" />
  <line x1="430" y1="165" x2="590" y2="165" stroke="#f59e0b" stroke-dasharray="2 2" stroke-width="1" />
  <text x="595" y="160" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fef08a" font-weight="bold">
    20 dB: 6.66 bps/Hz
  </text>

  <!-- Gray Code Legend -->
  <rect x="415" y="290" width="265" height="15" rx="3" fill="#020813" />
  <text x="547" y="301" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">
    Gray-Coded Mapping: Adjacent Symbols Differ by 1 Bit
  </text>

  <!-- Footer Equation Strip -->
  <rect x="24" y="320" width="672" height="28" rx="6" fill="#041026" stroke="#334155" stroke-width="0.8" />
  <text x="360" y="338" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">
    <tspan fill="#00F0B5" font-weight="bold">Shannon Capacity:</tspan> C = B &middot; log2(1 + SNR) &nbsp;|&nbsp;
    <tspan fill="#38bdf8" font-weight="bold">16-QAM Bit Error Rate:</tspan> Pb &approx; (3/8) &middot; erfc(&radic;(0.4 &middot; Eb/N0))
  </text>
</svg>
