<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <style>
      .wire { stroke: #14B8A6; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .wire-cross { stroke: #00F0B5; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .twiddle-node { fill: #041026; stroke: #F59E0B; stroke-width: 2; }
      .label-title { font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; font-weight: 800; fill: #F8FAFC; }
      .label-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94A3B8; }
      .label-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; fill: #00F0B5; }
      .twiddle-text { font-family: 'STIX Two Text', serif; font-size: 11px; font-weight: bold; fill: #F59E0B; }
      .node-dot { fill: #14B8A6; }
    </style>
  </defs>

  <rect width="600" height="400" rx="16" fill="#020813" stroke="#14B8A6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Title & IEEE Classification -->
  <text x="30" y="38" class="label-title">IEEE SIGNAL PROCESSING STD: 8-POINT RADIX-2 DIT-FFT SIGNAL FLOW GRAPH</text>
  <text x="30" y="58" class="label-text">Cooley-Tukey Butterfly Architecture • O(N log2 N) Decimation-in-Time Complex Twiddle Lattice</text>

  <!-- Stage Labels -->
  <text x="50" y="85" class="label-val">Bit-Reversed x[n]</text>
  <text x="180" y="85" class="label-text">Stage 1 (2-Pt)</text>
  <text x="320" y="85" class="label-text">Stage 2 (4-Pt)</text>
  <text x="460" y="85" class="label-val">Normal X[k]</text>

  <!-- Horizontal Sample Tracks (n=0 to 7) -->
  <!-- 0: x[0] -> X[0] -->
  <line x1="80" y1="110" x2="520" y2="110" class="wire"/>
  <circle cx="80" cy="110" r="3.5" class="node-dot"/>
  <text x="45" y="114" class="label-text">x[0]</text>
  <circle cx="520" cy="110" r="3.5" class="node-dot"/>
  <text x="530" y="114" class="label-val">X[0]</text>

  <!-- 1: x[4] -> X[1] -->
  <line x1="80" y1="145" x2="520" y2="145" class="wire"/>
  <circle cx="80" cy="145" r="3.5" class="node-dot"/>
  <text x="45" y="149" class="label-text">x[4]</text>
  <circle cx="520" cy="145" r="3.5" class="node-dot"/>
  <text x="530" y="149" class="label-val">X[1]</text>

  <!-- 2: x[2] -> X[2] -->
  <line x1="80" y1="180" x2="520" y2="180" class="wire"/>
  <circle cx="80" cy="180" r="3.5" class="node-dot"/>
  <text x="45" y="184" class="label-text">x[2]</text>
  <circle cx="520" cy="180" r="3.5" class="node-dot"/>
  <text x="530" y="184" class="label-val">X[2]</text>

  <!-- 3: x[6] -> X[3] -->
  <line x1="80" y1="215" x2="520" y2="215" class="wire"/>
  <circle cx="80" cy="215" r="3.5" class="node-dot"/>
  <text x="45" y="219" class="label-text">x[6]</text>
  <circle cx="520" cy="215" r="3.5" class="node-dot"/>
  <text x="530" y="219" class="label-val">X[3]</text>

  <!-- 4: x[1] -> X[4] -->
  <line x1="80" y1="250" x2="520" y2="250" class="wire"/>
  <circle cx="80" cy="250" r="3.5" class="node-dot"/>
  <text x="45" y="254" class="label-text">x[1]</text>
  <circle cx="520" cy="250" r="3.5" class="node-dot"/>
  <text x="530" y="254" class="label-val">X[4]</text>

  <!-- 5: x[5] -> X[5] -->
  <line x1="80" y1="285" x2="520" y2="285" class="wire"/>
  <circle cx="80" cy="285" r="3.5" class="node-dot"/>
  <text x="45" y="289" class="label-text">x[5]</text>
  <circle cx="520" cy="285" r="3.5" class="node-dot"/>
  <text x="530" y="289" class="label-val">X[5]</text>

  <!-- 6: x[3] -> X[6] -->
  <line x1="80" y1="320" x2="520" y2="320" class="wire"/>
  <circle cx="80" cy="320" r="3.5" class="node-dot"/>
  <text x="45" y="324" class="label-text">x[3]</text>
  <circle cx="520" cy="320" r="3.5" class="node-dot"/>
  <text x="530" y="324" class="label-val">X[6]</text>

  <!-- 7: x[7] -> X[7] -->
  <line x1="80" y1="355" x2="520" y2="355" class="wire"/>
  <circle cx="80" cy="355" r="3.5" class="node-dot"/>
  <text x="45" y="359" class="label-text">x[7]</text>
  <circle cx="520" cy="355" r="3.5" class="node-dot"/>
  <text x="530" y="359" class="label-val">X[7]</text>

  <!-- STAGE 1 BUTTERFLIES (x0-x4, x2-x6, x1-x5, x3-x7) -->
  <line x1="140" y1="110" x2="200" y2="145" class="wire-cross"/>
  <line x1="140" y1="145" x2="200" y2="110" class="wire-cross"/>
  <circle cx="170" cy="145" r="6" class="twiddle-node"/>
  <text x="165" y="149" class="twiddle-text">-1</text>

  <line x1="140" y1="180" x2="200" y2="215" class="wire-cross"/>
  <line x1="140" y1="215" x2="200" y2="180" class="wire-cross"/>
  <circle cx="170" cy="215" r="6" class="twiddle-node"/>
  <text x="165" y="219" class="twiddle-text">-1</text>

  <line x1="140" y1="250" x2="200" y2="285" class="wire-cross"/>
  <line x1="140" y1="285" x2="200" y2="250" class="wire-cross"/>
  <circle cx="170" cy="285" r="6" class="twiddle-node"/>
  <text x="165" y="289" class="twiddle-text">-1</text>

  <line x1="140" y1="320" x2="200" y2="355" class="wire-cross"/>
  <line x1="140" y1="355" x2="200" y2="320" class="wire-cross"/>
  <circle cx="170" cy="355" r="6" class="twiddle-node"/>
  <text x="165" y="359" class="twiddle-text">-1</text>

  <!-- STAGE 2 BUTTERFLIES (Span 2) -->
  <line x1="280" y1="110" x2="350" y2="180" class="wire-cross" stroke="#38BDF8"/>
  <line x1="280" y1="180" x2="350" y2="110" class="wire-cross" stroke="#38BDF8"/>
  <line x1="280" y1="145" x2="350" y2="215" class="wire-cross" stroke="#38BDF8"/>
  <line x1="280" y1="215" x2="350" y2="145" class="wire-cross" stroke="#38BDF8"/>

  <circle cx="315" cy="215" r="8" class="twiddle-node"/>
  <text x="307" y="219" class="twiddle-text">W_4^1</text>

  <!-- STAGE 3 BUTTERFLIES (Span 4) -->
  <line x1="420" y1="110" x2="490" y2="250" class="wire-cross" stroke="#A855F7"/>
  <line x1="420" y1="250" x2="490" y2="110" class="wire-cross" stroke="#A855F7"/>
  <line x1="420" y1="145" x2="490" y2="285" class="wire-cross" stroke="#A855F7"/>
  <line x1="420" y1="285" x2="490" y2="145" class="wire-cross" stroke="#A855F7"/>

  <circle cx="455" cy="285" r="8" class="twiddle-node"/>
  <text x="447" y="289" class="twiddle-text">W_8^1</text>

  <!-- Complexity Metric Legend -->
  <rect x="360" y="335" width="220" height="45" rx="8" fill="#041026" stroke="#14B8A6" stroke-opacity="0.5"/>
  <text x="370" y="352" class="label-val">Multiplications: (N/2) log2 N = 12</text>
  <text x="370" y="368" class="label-text">Direct DFT: N^2 = 64 (5.3x speedup)</text>
</svg>
