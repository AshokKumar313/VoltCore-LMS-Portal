<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="lvfp-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#03163b" />
      <stop offset="60%" stop-color="#020b1f" />
      <stop offset="100%" stop-color="#020813" />
    </radialGradient>
    <linearGradient id="lvfp-cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="lvfp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="210" fill="#2563EB" opacity="0.12" filter="url(#lvfp-glow)" />

  <!-- Octagonal Die Carrier -->
  <polygon points="150,36 362,36 476,150 476,362 362,476 150,476 36,362 36,150"
           fill="url(#lvfp-bg)" stroke="url(#lvfp-cobalt)" stroke-width="6" stroke-linejoin="round" />
  <polygon points="160,56 352,56 456,160 456,352 352,456 160,456 56,352 56,160"
           fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- FPGA Configurable Logic Block (CLB) Matrix (Center Core) -->
  <g transform="translate(146, 110)">
    <!-- 2x2 CLB Grid -->
    <!-- CLB Top-Left (with Look-Up Table LUT & DFF) -->
    <rect x="0" y="0" width="95" height="95" rx="8" fill="#041226" stroke="url(#lvfp-cobalt)" stroke-width="3" />
    <rect x="10" y="10" width="40" height="35" rx="4" fill="#020813" stroke="#60A5FA" stroke-width="1.8" />
    <text x="30" y="32" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#93C5FD" text-anchor="middle">LUT-4</text>
    <rect x="58" y="10" width="28" height="35" rx="4" fill="#020813" stroke="#38BDF8" stroke-width="1.8" />
    <text x="72" y="32" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#00F0B5" text-anchor="middle">FF</text>
    <text x="47" y="75" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA" text-anchor="middle">CLB [0,0]</text>

    <!-- CLB Top-Right -->
    <rect x="125" y="0" width="95" height="95" rx="8" fill="#041226" stroke="url(#lvfp-cobalt)" stroke-width="3" />
    <rect x="135" y="10" width="40" height="35" rx="4" fill="#020813" stroke="#60A5FA" stroke-width="1.8" />
    <text x="155" y="32" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#93C5FD" text-anchor="middle">LUT-4</text>
    <rect x="183" y="10" width="28" height="35" rx="4" fill="#020813" stroke="#38BDF8" stroke-width="1.8" />
    <text x="197" y="32" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#00F0B5" text-anchor="middle">FF</text>
    <text x="172" y="75" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA" text-anchor="middle">CLB [0,1]</text>

    <!-- CLB Bottom-Left -->
    <rect x="0" y="125" width="95" height="95" rx="8" fill="#041226" stroke="url(#lvfp-cobalt)" stroke-width="3" />
    <rect x="10" y="135" width="40" height="35" rx="4" fill="#020813" stroke="#60A5FA" stroke-width="1.8" />
    <text x="30" y="157" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#93C5FD" text-anchor="middle">LUT-4</text>
    <rect x="58" y="135" width="28" height="35" rx="4" fill="#020813" stroke="#38BDF8" stroke-width="1.8" />
    <text x="72" y="157" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#00F0B5" text-anchor="middle">FF</text>
    <text x="47" y="200" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA" text-anchor="middle">CLB [1,0]</text>

    <!-- CLB Bottom-Right -->
    <rect x="125" y="125" width="95" height="95" rx="8" fill="#041226" stroke="url(#lvfp-cobalt)" stroke-width="3" />
    <rect x="135" y="135" width="40" height="35" rx="4" fill="#020813" stroke="#60A5FA" stroke-width="1.8" />
    <text x="155" y="157" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#93C5FD" text-anchor="middle">LUT-4</text>
    <rect x="183" y="135" width="28" height="35" rx="4" fill="#020813" stroke="#38BDF8" stroke-width="1.8" />
    <text x="197" y="157" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#00F0B5" text-anchor="middle">FF</text>
    <text x="172" y="200" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA" text-anchor="middle">CLB [1,1]</text>

    <!-- Central Switch Box Matrix (Interconnect Channel) -->
    <circle cx="110" cy="110" r="14" fill="#020813" stroke="#F59E0B" stroke-width="2.5" />
    <line x1="102" y1="102" x2="118" y2="118" stroke="#F59E0B" stroke-width="2" />
    <line x1="118" y1="102" x2="102" y2="118" stroke="#F59E0B" stroke-width="2" />

    <!-- Routing Bus Wires -->
    <line x1="95" y1="47" x2="125" y2="47" stroke="#60A5FA" stroke-width="2" />
    <line x1="95" y1="172" x2="125" y2="172" stroke="#60A5FA" stroke-width="2" />
    <line x1="47" y1="95" x2="47" y2="125" stroke="#60A5FA" stroke-width="2" />
    <line x1="172" y1="95" x2="172" y2="125" stroke="#60A5FA" stroke-width="2" />
  </g>

  <!-- Verilog HDL Code Snippet Silhouette (Lower Region) -->
  <g transform="translate(126, 350)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93C5FD">
    <text x="0" y="0">always @(posedge clk or negedge rst_n)</text>
    <text x="20" y="14" fill="#00F0B5">if (!rst_n) q &lt;= 1'b0; else q &lt;= d;</text>
  </g>

  <!-- Peripheral Vias -->
  <g fill="#93C5FD">
    <circle cx="150" cy="36" r="6" /><circle cx="362" cy="36" r="6" />
    <circle cx="476" cy="150" r="6" /><circle cx="476" cy="362" r="6" />
    <circle cx="362" cy="476" r="6" /><circle cx="150" cy="476" r="6" />
    <circle cx="36" cy="362" r="6" /><circle cx="36" cy="150" r="6" />
  </g>

  <!-- Editorial Ribbon Label -->
  <g transform="translate(256, 442)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#020813" stroke="url(#lvfp-cobalt)" stroke-width="1.5" />
    <text y="4" font-family="'Manrope', 'Inter', sans-serif" font-size="10" font-weight="800"
          letter-spacing="2" fill="#93C5FD" text-anchor="middle">
      VERILOG HDL &amp; FPGA SYSTEM PROTOTYPING
    </text>
  </g>
</svg>