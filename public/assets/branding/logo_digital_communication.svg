<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ldc-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#190b2e" />
      <stop offset="60%" stop-color="#0c0417" />
      <stop offset="100%" stop-color="#020813" />
    </radialGradient>
    <linearGradient id="ldc-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="40%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <filter id="ldc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="210" fill="#8B5CF6" opacity="0.12" filter="url(#ldc-glow)" />

  <!-- Octagonal Die Carrier -->
  <polygon points="150,36 362,36 476,150 476,362 362,476 150,476 36,362 36,150"
           fill="url(#ldc-bg)" stroke="url(#ldc-violet)" stroke-width="6" stroke-linejoin="round" />
  <polygon points="160,56 352,56 456,160 456,352 352,456 160,456 56,352 56,160"
           fill="none" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- NRZ / Manchester Encoded Bitstream Waveform (Top Half) -->
  <g transform="translate(106, 95)" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="35" x2="300" y2="35" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />
    <!-- Wave: High, Low, High, High, Low, High -->
    <path d="M 0,10 L 50,10 L 50,35 L 100,35 L 100,10 L 200,10 L 200,35 L 250,35 L 250,10 L 300,10"
          fill="none" stroke="#C4B5FD" stroke-width="3" />
    <!-- Bit labels -->
    <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#A78BFA" text-anchor="middle">
      <text x="25" y="0">1</text><text x="75" y="0">0</text><text x="125" y="0">1</text>
      <text x="175" y="0">1</text><text x="225" y="0">0</text><text x="275" y="0">1</text>
    </g>
  </g>

  <!-- 16-QAM Constellation Plane (Center-Lower Region) -->
  <g transform="translate(156, 175)">
    <!-- Quadrature (Q) & In-Phase (I) Orthogonal Axes -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="100" y1="0" x2="100" y2="200" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <text x="205" y="104" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">I</text>
    <text x="95" y="-5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">Q</text>

    <!-- 4x4 Grid Decision Boundaries -->
    <g stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 3" opacity="0.35">
      <line x1="25" y1="0" x2="25" y2="200" /><line x1="75" y1="0" x2="75" y2="200" />
      <line x1="125" y1="0" x2="125" y2="200" /><line x1="175" y1="0" x2="175" y2="200" />
      <line x1="0" y1="25" x2="200" y2="25" /><line x1="0" y1="75" x2="200" y2="75" />
      <line x1="0" y1="125" x2="200" y2="125" /><line x1="0" y1="175" x2="200" y2="175" />
    </g>

    <!-- 16 Constellation Symbol Points with Outer Corners in Amber Gold -->
    <g fill="#A78BFA">
      <circle cx="25" cy="25" r="4.5" fill="#F59E0B" /><circle cx="75" cy="25" r="4.5" />
      <circle cx="125" cy="25" r="4.5" /><circle cx="175" cy="25" r="4.5" fill="#F59E0B" />
      <circle cx="25" cy="75" r="4.5" /><circle cx="75" cy="75" r="4.5" fill="#00F0B5" />
      <circle cx="125" cy="75" r="4.5" fill="#00F0B5" /><circle cx="175" cy="75" r="4.5" />
      <circle cx="25" cy="125" r="4.5" /><circle cx="75" cy="125" r="4.5" fill="#00F0B5" />
      <circle cx="125" cy="125" r="4.5" fill="#00F0B5" /><circle cx="175" cy="125" r="4.5" />
      <circle cx="25" cy="175" r="4.5" fill="#F59E0B" /><circle cx="75" cy="175" r="4.5" />
      <circle cx="125" cy="175" r="4.5" /><circle cx="175" cy="175" r="4.5" fill="#F59E0B" />
    </g>
  </g>

  <!-- Peripheral Vias -->
  <g fill="#C4B5FD">
    <circle cx="150" cy="36" r="6" /><circle cx="362" cy="36" r="6" />
    <circle cx="476" cy="150" r="6" /><circle cx="476" cy="362" r="6" />
    <circle cx="362" cy="476" r="6" /><circle cx="150" cy="476" r="6" />
    <circle cx="36" cy="362" r="6" /><circle cx="36" cy="150" r="6" />
  </g>

  <!-- Editorial Ribbon Label -->
  <g transform="translate(256, 442)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#020813" stroke="url(#ldc-violet)" stroke-width="1.5" />
    <text y="4" font-family="'Manrope', 'Inter', sans-serif" font-size="10" font-weight="800"
          letter-spacing="2" fill="#C4B5FD" text-anchor="middle">
      DIGITAL COMMUNICATION SYSTEMS
    </text>
  </g>
</svg>