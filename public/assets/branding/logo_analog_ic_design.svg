<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="laic-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241303" />
      <stop offset="60%" stop-color="#120801" />
      <stop offset="100%" stop-color="#020813" />
    </radialGradient>
    <linearGradient id="laic-copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="laic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="210" fill="#D97706" opacity="0.12" filter="url(#laic-glow)" />

  <!-- Octagonal Die Carrier -->
  <polygon points="150,36 362,36 476,150 476,362 362,476 150,476 36,362 36,150"
           fill="url(#laic-bg)" stroke="url(#laic-copper)" stroke-width="6" stroke-linejoin="round" />
  <polygon points="160,56 352,56 456,160 456,352 352,456 160,456 56,352 56,160"
           fill="none" stroke="#D97706" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Analog MOS Differential Pair Schematic (Center-Left) -->
  <g transform="translate(136, 90)" stroke="url(#laic-copper)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- VDD Power Rail -->
    <line x1="20" y1="20" x2="220" y2="20" stroke="#FCD34D" stroke-width="3.5" />
    <circle cx="120" cy="20" r="4" fill="#FCD34D" stroke="none" />
    <text x="120" y="12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FCD34D" text-anchor="middle" stroke="none">VDD</text>

    <!-- Active PMOS Load Left (M3) -->
    <line x1="60" y1="20" x2="60" y2="60" />
    <rect x="45" y="60" width="30" height="20" rx="3" stroke="#FCD34D" stroke-width="2" />
    <line x1="60" y1="80" x2="60" y2="110" />

    <!-- Active PMOS Load Right (M4) -->
    <line x1="180" y1="20" x2="180" y2="60" />
    <rect x="165" y="60" width="30" height="20" rx="3" stroke="#FCD34D" stroke-width="2" />
    <line x1="180" y1="80" x2="180" y2="110" />

    <!-- Current Mirror Gate Connection -->
    <line x1="45" y1="70" x2="165" y2="70" stroke-dasharray="3 3" />
    <line x1="45" y1="70" x2="45" y2="95" />
    <line x1="45" y1="95" x2="60" y2="95" />

    <!-- NMOS Differential Pair (M1 & M2) -->
    <!-- Input Vin+ on Gate M1 -->
    <line x1="20" y1="140" x2="50" y2="140" />
    <circle cx="20" cy="140" r="3.5" fill="#FCD34D" stroke="none" />
    <line x1="50" y1="125" x2="50" y2="155" stroke-width="4" stroke="#FFF" />
    <line x1="60" y1="110" x2="60" y2="170" />

    <!-- Input Vin- on Gate M2 -->
    <line x1="220" y1="140" x2="190" y2="140" />
    <circle cx="220" cy="140" r="3.5" fill="#FCD34D" stroke="none" />
    <line x1="190" y1="125" x2="190" y2="155" stroke-width="4" stroke="#FFF" />
    <line x1="180" y1="110" x2="180" y2="170" />

    <!-- Common Source Coupled Tail Node -->
    <line x1="60" y1="170" x2="180" y2="170" />
    <line x1="120" y1="170" x2="120" y2="210" />

    <!-- Tail Current Source Iss / Sink -->
    <circle cx="120" cy="225" r="14" fill="#020813" stroke="#FCD34D" stroke-width="2.5" />
    <line x1="120" y1="216" x2="120" y2="234" stroke="#FCD34D" stroke-width="2" />
    <polygon points="120,237 116,229 124,229" fill="#FCD34D" stroke="none" />
    <line x1="120" y1="239" x2="120" y2="255" />
    <!-- Ground Rail -->
    <line x1="105" y1="255" x2="135" y2="255" stroke="#94A3B8" />
  </g>

  <!-- Bode Gain-Bandwidth Frequency Response Curve (Lower Right) -->
  <g transform="translate(150, 360)">
    <line x1="0" y1="30" x2="210" y2="30" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 10,0 L 70,0 Q 110,0 140,15 L 200,30" fill="none" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round" />
    <text x="75" y="-6" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#FCD34D">Av ≈ 60dB</text>
    <text x="180" y="42" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#CBD5E1">GBW</text>
  </g>

  <!-- Peripheral Vias -->
  <g fill="#FCD34D">
    <circle cx="150" cy="36" r="6" /><circle cx="362" cy="36" r="6" />
    <circle cx="476" cy="150" r="6" /><circle cx="476" cy="362" r="6" />
    <circle cx="362" cy="476" r="6" /><circle cx="150" cy="476" r="6" />
    <circle cx="36" cy="362" r="6" /><circle cx="36" cy="150" r="6" />
  </g>

  <!-- Editorial Ribbon Label -->
  <g transform="translate(256, 442)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#020813" stroke="url(#laic-copper)" stroke-width="1.5" />
    <text y="4" font-family="'Manrope', 'Inter', sans-serif" font-size="10" font-weight="800"
          letter-spacing="2" fill="#FCD34D" text-anchor="middle">
      ANALOG INTEGRATED CIRCUITS DESIGN
    </text>
  </g>
</svg>