<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="esp-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#022119" />
      <stop offset="60%" stop-color="#02120e" />
      <stop offset="100%" stop-color="#020813" />
    </radialGradient>

    <!-- Emerald Luminous Gradient -->
    <linearGradient id="esp-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#00F0B5" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Twiddle Factor Gold Gradient -->
    <linearGradient id="esp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="esp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="#00F0B5" opacity="0.12" filter="url(#esp-glow)" />

  <!-- Outer Octagonal Silicon Carrier -->
  <polygon points="150,36 362,36 476,150 476,362 362,476 150,476 36,362 36,150"
           fill="url(#esp-bg)" stroke="url(#esp-emerald)" stroke-width="6" stroke-linejoin="round" />

  <!-- Inner Die Inset -->
  <polygon points="160,56 352,56 456,160 456,352 352,456 160,456 56,352 56,160"
           fill="none" stroke="#00F0B5" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Unit Circle in Z-Plane (Background Geometry) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00F0B5" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="url(#esp-gold)" stroke-width="1.0" stroke-opacity="0.25" />

  <!-- Discrete-Time Stem Plot (x[n] Lollipop samples across top half) -->
  <g stroke="#00F0B5" stroke-width="2" opacity="0.75">
    <!-- Zero axis -->
    <line x1="80" y1="140" x2="432" y2="140" stroke-dasharray="3 3" opacity="0.4" />
    <!-- Stems -->
    <line x1="120" y1="140" x2="120" y2="120" />
    <line x1="150" y1="140" x2="150" y2="90" />
    <line x1="180" y1="140" x2="180" y2="70" />
    <line x1="210" y1="140" x2="210" y2="80" />
    <line x1="240" y1="140" x2="240" y2="125" />
    <line x1="270" y1="140" x2="270" y2="165" />
    <line x1="300" y1="140" x2="300" y2="190" />
    <line x1="330" y1="140" x2="330" y2="175" />
    <line x1="360" y1="140" x2="360" y2="135" />
    <line x1="390" y1="140" x2="390" y2="105" />
  </g>

  <!-- Lollipop Sample Heads -->
  <g fill="url(#esp-gold)">
    <circle cx="120" cy="120" r="4.5" />
    <circle cx="150" cy="90" r="4.5" />
    <circle cx="180" cy="70" r="5" fill="#6EE7B7" />
    <circle cx="210" cy="80" r="4.5" />
    <circle cx="240" cy="125" r="4" />
    <circle cx="270" cy="165" r="4" />
    <circle cx="300" cy="190" r="5" fill="#6EE7B7" />
    <circle cx="330" cy="175" r="4.5" />
    <circle cx="360" cy="135" r="4" />
    <circle cx="390" cy="105" r="4.5" />
  </g>

  <!-- Radix-2 FFT Butterfly Lattice Signal Flow Graph (Center-Bottom) -->
  <g transform="translate(140, 230)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top & Bottom Rails -->
    <line x1="0" y1="30" x2="232" y2="30" stroke="url(#esp-emerald)" stroke-width="4" />
    <line x1="0" y1="130" x2="232" y2="130" stroke="url(#esp-emerald)" stroke-width="4" />

    <!-- Crossing Butterfly Signal Lines -->
    <line x1="40" y1="30" x2="192" y2="130" stroke="url(#esp-gold)" stroke-width="3.5" />
    <line x1="40" y1="130" x2="192" y2="30" stroke="#38BDF8" stroke-width="3.5" />

    <!-- Summing Junctions & Directional Arrows -->
    <circle cx="192" cy="30" r="8" fill="#020813" stroke="url(#esp-emerald)" stroke-width="3" />
    <text x="192" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#6EE7B7" text-anchor="middle" stroke="none">+</text>

    <circle cx="192" cy="130" r="8" fill="#020813" stroke="url(#esp-emerald)" stroke-width="3" />
    <text x="192" y="133" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#F59E0B" text-anchor="middle" stroke="none">−</text>

    <!-- Input / Output Nodes -->
    <circle cx="0" cy="30" r="6" fill="#00F0B5" stroke="none" />
    <circle cx="0" cy="130" r="6" fill="#00F0B5" stroke="none" />
    <circle cx="232" cy="30" r="6" fill="url(#esp-gold)" stroke="none" />
    <circle cx="232" cy="130" r="6" fill="url(#esp-gold)" stroke="none" />

    <!-- Twiddle Factor Multiplication Node W_N^k -->
    <circle cx="116" cy="80" r="14" fill="#020813" stroke="url(#esp-gold)" stroke-width="2" />
    <text x="116" y="84" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#F59E0B" text-anchor="middle" stroke="none">W</text>
  </g>

  <!-- Peripheral Solder Vias at 8 Octagon Vertices -->
  <g fill="#6EE7B7">
    <circle cx="150" cy="36" r="6" />
    <circle cx="362" cy="36" r="6" />
    <circle cx="476" cy="150" r="6" />
    <circle cx="476" cy="362" r="6" />
    <circle cx="362" cy="476" r="6" />
    <circle cx="150" cy="476" r="6" />
    <circle cx="36" cy="362" r="6" />
    <circle cx="36" cy="150" r="6" />
  </g>

  <!-- Editorial Subfield Ribbon Label (Zero Course Codes) -->
  <g transform="translate(256, 442)">
    <rect x="-130" y="-12" width="260" height="24" rx="12" fill="#020813" stroke="url(#esp-emerald)" stroke-width="1.5" />
    <text y="4" font-family="'Manrope', 'Inter', sans-serif" font-size="10" font-weight="800"
          letter-spacing="2.5" fill="#6EE7B7" text-anchor="middle">
      SIGNALS &amp; DSP ALGORITHMS
    </text>
  </g>
</svg>