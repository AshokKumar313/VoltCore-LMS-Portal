<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00693E"/>
      <stop offset="50%" stop-color="#041026"/>
      <stop offset="100%" stop-color="#00F0B5"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="36" fill="#020813" stroke="#00F0B5" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="20" y="20" width="200" height="200" rx="28" fill="url(#badgeGrad)" stroke="#00F0B5" stroke-width="3" filter="url(#badgeGlow)"/>

  <!-- Sovereign Silicon Microchip Frame -->
  <rect x="50" y="50" width="140" height="140" rx="16" fill="#020813" stroke="#00F0B5" stroke-width="2"/>

  <!-- Central Flash Wave / Lightning -->
  <path d="M 125 65 L 85 130 L 120 130 L 115 175 L 155 110 L 120 110 Z" fill="#00F0B5" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Corner Silicon Pins -->
  <line x1="30" y1="80" x2="50" y2="80" stroke="#00F0B5" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="120" x2="50" y2="120" stroke="#00F0B5" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="160" x2="50" y2="160" stroke="#00F0B5" stroke-width="3" stroke-linecap="round"/>

  <line x1="190" y1="80" x2="210" y2="80" stroke="#00F0B5" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="120" x2="210" y2="120" stroke="#00F0B5" stroke-width="3" stroke-linecap="round"/>
  <line x1="190" y1="160" x2="210" y2="160" stroke="#00F0B5" stroke-width="3" stroke-linecap="round"/>

  <!-- Institutional Typography -->
  <text x="120" y="210" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#00F0B5" letter-spacing="2">
    VOLTCORE • MIT ECE
  </text>
</svg>
