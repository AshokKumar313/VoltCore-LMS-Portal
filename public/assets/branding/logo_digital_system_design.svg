<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ldsd-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#031a38" />
      <stop offset="60%" stop-color="#020e21" />
      <stop offset="100%" stop-color="#020813" />
    </radialGradient>
    <linearGradient id="ldsd-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="ldsd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="210" fill="#3B82F6" opacity="0.12" filter="url(#ldsd-glow)" />

  <!-- Octagonal Die Carrier -->
  <polygon points="150,36 362,36 476,150 476,362 362,476 150,476 36,362 36,150"
           fill="url(#ldsd-bg)" stroke="url(#ldsd-blue)" stroke-width="6" stroke-linejoin="round" />
  <polygon points="160,56 352,56 456,160 456,352 352,456 160,456 56,352 56,160"
           fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Timing Diagram: Clock (CLK) & Data (D) Waves Across Top -->
  <g transform="translate(96, 90)" stroke-linecap="round" stroke-linejoin="round">
    <!-- CLK Waveform -->
    <path d="M 0,25 L 40,25 L 40,0 L 80,0 L 80,25 L 120,25 L 120,0 L 160,0 L 160,25 L 200,25 L 200,0 L 240,0 L 240,25 L 280,25 L 280,0 L 320,0"
          fill="none" stroke="#60A5FA" stroke-width="2.5" />
    <!-- Rising-edge Arrow triggers -->
    <polygon points="40,12 36,19 44,19" fill="#00F0B5" />
    <polygon points="120,12 116,19 124,19" fill="#00F0B5" />
    <polygon points="200,12 196,19 204,19" fill="#00F0B5" />
    <polygon points="280,12 276,19 284,19" fill="#00F0B5" />

    <!-- Synchronous Data Waveform (D) -->
    <path d="M 0,55 L 80,55 L 80,35 L 200,35 L 200,55 L 320,55"
          fill="none" stroke="#F59E0B" stroke-width="2.5" />
  </g>

  <!-- Synchronous D-Type Flip-Flop Register Core (Center) -->
  <g transform="translate(196, 185)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Register Box -->
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#041226" stroke="url(#ldsd-blue)" stroke-width="4.5" />

    <!-- Clock Dynamic Triangle Wedge -->
    <path d="M 0,70 L 18,80 L 0,90" fill="none" stroke="#60A5FA" stroke-width="3" />

    <!-- Pin Leads & Labels -->
    <line x1="-35" y1="35" x2="0" y2="35" stroke="url(#ldsd-blue)" stroke-width="3.5" />
    <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFF">D</text>

    <line x1="-35" y1="80" x2="0" y2="80" stroke="url(#ldsd-blue)" stroke-width="3.5" />
    <text x="24" y="85" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#60A5FA">CLK</text>

    <line x1="120" y1="35" x2="155" y2="35" stroke="url(#ldsd-blue)" stroke-width="3.5" />
    <text x="96" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#00F0B5">Q</text>

    <line x1="120" y1="115" x2="155" y2="115" stroke="url(#ldsd-blue)" stroke-width="3.5" />
    <text x="96" y="122" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#93C5FD">Q'</text>

    <!-- Pin Nodes -->
    <circle cx="-35" cy="35" r="4.5" fill="#3B82F6" />
    <circle cx="-35" cy="80" r="4.5" fill="#60A5FA" />
    <circle cx="155" cy="35" r="4.5" fill="#00F0B5" />
    <circle cx="155" cy="115" r="4.5" fill="#93C5FD" />
  </g>

  <!-- Peripheral Solder Vias -->
  <g fill="#93C5FD">
    <circle cx="150" cy="36" r="6" /><circle cx="362" cy="36" r="6" />
    <circle cx="476" cy="150" r="6" /><circle cx="476" cy="362" r="6" />
    <circle cx="362" cy="476" r="6" /><circle cx="150" cy="476" r="6" />
    <circle cx="36" cy="362" r="6" /><circle cx="36" cy="150" r="6" />
  </g>

  <!-- Editorial Ribbon Label -->
  <g transform="translate(256, 442)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#020813" stroke="url(#ldsd-blue)" stroke-width="1.5" />
    <text y="4" font-family="'Manrope', 'Inter', sans-serif" font-size="10" font-weight="800"
          letter-spacing="2" fill="#93C5FD" text-anchor="middle">
      DIGITAL SYSTEM DESIGN &amp; MICROPROCESSORS
    </text>
  </g>
</svg>