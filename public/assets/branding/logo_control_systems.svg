<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="lcs-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2b030d" />
      <stop offset="60%" stop-color="#140106" />
      <stop offset="100%" stop-color="#020813" />
    </radialGradient>
    <linearGradient id="lcs-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="80%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="lcs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="210" fill="#E11D48" opacity="0.12" filter="url(#lcs-glow)" />

  <!-- Octagonal Die Carrier -->
  <polygon points="150,36 362,36 476,150 476,362 362,476 150,476 36,362 36,150"
           fill="url(#lcs-bg)" stroke="url(#lcs-crimson)" stroke-width="6" stroke-linejoin="round" />
  <polygon points="160,56 352,56 456,160 456,352 352,456 160,456 56,352 56,160"
           fill="none" stroke="#E11D48" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Closed-Loop Feedback Control System Block Diagram (Top Half) -->
  <g transform="translate(106, 95)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Input Reference R(s) Arrow -->
    <line x1="0" y1="45" x2="45" y2="45" stroke="#FDA4AF" stroke-width="3" />
    <polygon points="45,45 35,40 35,50" fill="#FDA4AF" />
    <text x="10" y="35" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FDA4AF">R(s)</text>

    <!-- Summing Junction Circle (+) & (-) -->
    <circle cx="60" cy="45" r="14" fill="#040b17" stroke="url(#lcs-crimson)" stroke-width="2.5" />
    <line x1="53" y1="45" x2="67" y2="45" stroke="#FDA4AF" stroke-width="2" />
    <line x1="60" y1="38" x2="60" y2="52" stroke="#FDA4AF" stroke-width="2" />
    <text x="60" y="72" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#FDA4AF" text-anchor="middle">−</text>

    <!-- Error E(s) line to Controller G(s) Block -->
    <line x1="74" y1="45" x2="115" y2="45" stroke="#FDA4AF" stroke-width="3" />
    <polygon points="115,45 105,40 105,50" fill="#FDA4AF" />

    <!-- Plant G(s) Forward Transfer Block -->
    <rect x="115" y="25" width="80" height="40" rx="5" fill="#041226" stroke="url(#lcs-crimson)" stroke-width="3" />
    <text x="155" y="49" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">G(s)</text>

    <!-- Output C(s) line -->
    <line x1="195" y1="45" x2="280" y2="45" stroke="#FDA4AF" stroke-width="3" />
    <polygon points="280,45 270,40 270,50" fill="#FDA4AF" />
    <text x="270" y="35" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00F0B5">Y(s)</text>

    <!-- Negative Feedback Loop with Sensor H(s) Block -->
    <circle cx="235" cy="45" r="4" fill="#FDA4AF" />
    <path d="M 235,45 L 235,105 L 195,105" fill="none" stroke="#F43F5E" stroke-width="2.5" />
    <rect x="115" y="85" width="80" height="40" rx="5" fill="#041226" stroke="#F43F5E" stroke-width="2.5" />
    <text x="155" y="109" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FDA4AF" text-anchor="middle">H(s)</text>
    <path d="M 115,105 L 60,105 L 60,63" fill="none" stroke="#F43F5E" stroke-width="2.5" />
    <polygon points="60,63 56,71 64,71" fill="#F43F5E" />
  </g>

  <!-- Root-Locus Complex Plane Trajectory (Lower Region) -->
  <g transform="translate(156, 240)">
    <!-- Axes: sigma and jw -->
    <line x1="-30" y1="90" x2="230" y2="90" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="140" y1="10" x2="140" y2="170" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <text x="235" y="94" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">σ</text>
    <text x="145" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">jω</text>

    <!-- Open Loop Poles (X) -->
    <g stroke="#E11D48" stroke-width="4" stroke-linecap="round">
      <line x1="50" y1="40" x2="70" y2="60" /><line x1="70" y1="40" x2="50" y2="60" />
      <line x1="50" y1="120" x2="70" y2="140" /><line x1="70" y1="120" x2="50" y2="140" />
      <line x1="0" y1="80" x2="20" y2="100" /><line x1="20" y1="80" x2="0" y2="100" />
    </g>

    <!-- Root-Locus Branches -->
    <path d="M 60,50 Q 20,65 -20,65" fill="none" stroke="#FB7185" stroke-width="2.5" stroke-dasharray="5 3" />
    <path d="M 60,130 Q 20,115 -20,115" fill="none" stroke="#FB7185" stroke-width="2.5" stroke-dasharray="5 3" />
  </g>

  <!-- Peripheral Vias -->
  <g fill="#FDA4AF">
    <circle cx="150" cy="36" r="6" /><circle cx="362" cy="36" r="6" />
    <circle cx="476" cy="150" r="6" /><circle cx="476" cy="362" r="6" />
    <circle cx="362" cy="476" r="6" /><circle cx="150" cy="476" r="6" />
    <circle cx="36" cy="362" r="6" /><circle cx="36" cy="150" r="6" />
  </g>

  <!-- Editorial Ribbon Label -->
  <g transform="translate(256, 442)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#020813" stroke="url(#lcs-crimson)" stroke-width="1.5" />
    <text y="4" font-family="'Manrope', 'Inter', sans-serif" font-size="10" font-weight="800"
          letter-spacing="2" fill="#FDA4AF" text-anchor="middle">
      CONTROL SYSTEMS ENGINEERING
    </text>
  </g>
</svg>