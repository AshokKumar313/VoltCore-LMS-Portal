<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="ecs-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1b0c30" />
      <stop offset="60%" stop-color="#0d041c" />
      <stop offset="100%" stop-color="#020813" />
    </radialGradient>

    <!-- Royal Violet Gradient -->
    <linearGradient id="ecs-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="40%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Radiating Wave Amber Gold Gradient -->
    <linearGradient id="ecs-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="ecs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="#8B5CF6" opacity="0.12" filter="url(#ecs-glow)" />

  <!-- Outer Octagonal Carrier Frame -->
  <polygon points="150,36 362,36 476,150 476,362 362,476 150,476 36,362 36,150"
           fill="url(#ecs-bg)" stroke="url(#ecs-violet)" stroke-width="6" stroke-linejoin="round" />

  <!-- Inner Die Chamfer Inset -->
  <polygon points="160,56 352,56 456,160 456,352 352,456 160,456 56,352 56,160"
           fill="none" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- 16-QAM Constellation Lattice Grid (Left Background) -->
  <g transform="translate(100, 110)" opacity="0.55">
    <line x1="-30" y1="30" x2="90" y2="30" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="30" y1="-30" x2="30" y2="90" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 3" />
    <!-- 4x4 Constellation Points -->
    <circle cx="0" cy="0" r="3" fill="#F59E0B" />
    <circle cx="20" cy="0" r="3" fill="#8B5CF6" />
    <circle cx="40" cy="0" r="3" fill="#8B5CF6" />
    <circle cx="60" cy="0" r="3" fill="#F59E0B" />
    <circle cx="0" cy="20" r="3" fill="#8B5CF6" />
    <circle cx="20" cy="20" r="3" fill="#00F0B5" />
    <circle cx="40" cy="20" r="3" fill="#00F0B5" />
    <circle cx="60" cy="20" r="3" fill="#8B5CF6" />
    <circle cx="0" cy="40" r="3" fill="#8B5CF6" />
    <circle cx="20" cy="40" r="3" fill="#00F0B5" />
    <circle cx="40" cy="40" r="3" fill="#00F0B5" />
    <circle cx="60" cy="40" r="3" fill="#8B5CF6" />
    <circle cx="0" cy="60" r="3" fill="#F59E0B" />
    <circle cx="20" cy="60" r="3" fill="#8B5CF6" />
    <circle cx="40" cy="60" r="3" fill="#8B5CF6" />
    <circle cx="60" cy="60" r="3" fill="#F59E0B" />
  </g>

  <!-- Parabolic Dish Reflector Antenna & Feed Horn (Center Left) -->
  <g transform="translate(170, 240)">
    <!-- Base Mount & Pedestal -->
    <path d="M 0,90 L 0,40 L 40,0" stroke="url(#ecs-violet)" stroke-width="4" fill="none" stroke-linecap="round" />
    <line x1="-30" y1="90" x2="30" y2="90" stroke="url(#ecs-violet)" stroke-width="5" stroke-linecap="round" />

    <!-- Parabolic Reflector Dish Arc -->
    <path d="M 10,-65 Q 50,0 10,65" fill="none" stroke="url(#ecs-violet)" stroke-width="6" stroke-linecap="round" />

    <!-- Feed Horn Struts & Sub-reflector -->
    <line x1="30" y1="0" x2="75" y2="0" stroke="url(#ecs-gold)" stroke-width="3" stroke-linecap="round" />
    <circle cx="75" cy="0" r="6" fill="#F59E0B" />
  </g>

  <!-- Concentric Electromagnetic Wavefront Arcs Radiating Outward -->
  <g stroke="url(#ecs-gold)" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 285,190 A 60 60 0 0 1 285,290" stroke-width="3" />
    <path d="M 320,165 A 95 95 0 0 1 320,315" stroke-width="3.5" stroke-dasharray="12 4" />
    <path d="M 360,140 A 135 135 0 0 1 360,340" stroke-width="4" />
    <path d="M 400,115 A 175 175 0 0 1 400,365" stroke-width="4.5" stroke-dasharray="16 6" />
  </g>

  <!-- Modulated High-Frequency Carrier Bursts Flowing Below -->
  <path d="M 70,380 Q 95,350 120,380 T 170,380 T 220,380 T 270,380 T 320,380 T 370,380 T 420,380"
        fill="none" stroke="#C4B5FD" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />

  <!-- Peripheral Solder Vias at 8 Octagon Vertices -->
  <g fill="#FDE68A">
    <circle cx="150" cy="36" r="6" />
    <circle cx="362" cy="36" r="6" />
    <circle cx="476" cy="150" r="6" />
    <circle cx="476" cy="362" r="6" />
    <circle cx="362" cy="476" r="6" />
    <circle cx="150" cy="476" r="6" />
    <circle cx="36" cy="362" r="6" />
    <circle cx="36" cy="150" r="6" />
  </g>

  <!-- Editorial Subfield Ribbon Label (Zero Course Codes) -->
  <g transform="translate(256, 442)">
    <rect x="-135" y="-12" width="270" height="24" rx="12" fill="#020813" stroke="url(#ecs-violet)" stroke-width="1.5" />
    <text y="4" font-family="'Manrope', 'Inter', sans-serif" font-size="10" font-weight="800"
          letter-spacing="2.5" fill="#C4B5FD" text-anchor="middle">
      COMMUNICATIONS &amp; RF SYSTEMS
    </text>
  </g>
</svg>