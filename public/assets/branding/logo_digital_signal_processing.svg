<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ldsp-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#022119" />
      <stop offset="60%" stop-color="#02120e" />
      <stop offset="100%" stop-color="#020813" />
    </radialGradient>
    <linearGradient id="ldsp-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="ldsp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="ldsp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="210" fill="#10B981" opacity="0.12" filter="url(#ldsp-glow)" />

  <!-- Octagonal Silicon Die Carrier -->
  <polygon points="150,36 362,36 476,150 476,362 362,476 150,476 36,362 36,150"
           fill="url(#ldsp-bg)" stroke="url(#ldsp-emerald)" stroke-width="6" stroke-linejoin="round" />
  <polygon points="160,56 352,56 456,160 456,352 352,456 160,456 56,352 56,160"
           fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Continuous Sinc Envelope Curve -->
  <path d="M 60,150 Q 110,150 160,130 T 210,90 T 256,60 T 302,90 T 352,130 T 452,150"
        fill="none" stroke="#34D399" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Discrete Sinc Stem Plot -->
  <g stroke="#10B981" stroke-width="2.2" opacity="0.85">
    <line x1="80" y1="150" x2="432" y2="150" stroke-dasharray="3 3" opacity="0.3" />
    <line x1="120" y1="150" x2="120" y2="140" />
    <line x1="150" y1="150" x2="150" y2="125" />
    <line x1="180" y1="150" x2="180" y2="105" />
    <line x1="210" y1="150" x2="210" y2="80" />
    <line x1="256" y1="150" x2="256" y2="60" />
    <line x1="302" y1="150" x2="302" y2="80" />
    <line x1="332" y1="150" x2="332" y2="105" />
    <line x1="362" y1="150" x2="362" y2="125" />
    <line x1="392" y1="150" x2="392" y2="140" />
  </g>

  <!-- Sinc Stem Lollipop Heads -->
  <g fill="url(#ldsp-gold)">
    <circle cx="120" cy="140" r="4" />
    <circle cx="150" cy="125" r="4.5" />
    <circle cx="180" cy="105" r="5" />
    <circle cx="210" cy="80" r="5.5" fill="#34D399" />
    <circle cx="256" cy="60" r="7" fill="#6EE7B7" />
    <circle cx="302" cy="80" r="5.5" fill="#34D399" />
    <circle cx="332" cy="105" r="5" />
    <circle cx="362" cy="125" r="4.5" />
    <circle cx="392" cy="140" r="4" />
  </g>

  <!-- Radix-2 FFT Butterfly Lattice Signal Flow Graph (Lower Half) -->
  <g transform="translate(136, 220)" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="35" x2="240" y2="35" stroke="url(#ldsp-emerald)" stroke-width="4.5" />
    <line x1="0" y1="145" x2="240" y2="145" stroke="url(#ldsp-emerald)" stroke-width="4.5" />
    <line x1="40" y1="35" x2="200" y2="145" stroke="url(#ldsp-gold)" stroke-width="3.5" />
    <line x1="40" y1="145" x2="200" y2="35" stroke="#38BDF8" stroke-width="3.5" />

    <circle cx="200" cy="35" r="9" fill="#020813" stroke="url(#ldsp-emerald)" stroke-width="3" />
    <text x="200" y="39" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#34D399" text-anchor="middle" stroke="none">+</text>

    <circle cx="200" cy="145" r="9" fill="#020813" stroke="url(#ldsp-emerald)" stroke-width="3" />
    <text x="200" y="148" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#F59E0B" text-anchor="middle" stroke="none">−</text>

    <circle cx="0" cy="35" r="6" fill="#10B981" stroke="none" />
    <circle cx="0" cy="145" r="6" fill="#10B981" stroke="none" />
    <circle cx="240" cy="35" r="6" fill="url(#ldsp-gold)" stroke="none" />
    <circle cx="240" cy="145" r="6" fill="url(#ldsp-gold)" stroke="none" />

    <!-- Twiddle Factor W_N^k Node -->
    <circle cx="120" cy="90" r="15" fill="#020813" stroke="url(#ldsp-gold)" stroke-width="2.5" />
    <text x="120" y="94" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#F59E0B" text-anchor="middle" stroke="none">W</text>
  </g>

  <!-- Peripheral Corner Vias -->
  <g fill="#34D399">
    <circle cx="150" cy="36" r="6" /><circle cx="362" cy="36" r="6" />
    <circle cx="476" cy="150" r="6" /><circle cx="476" cy="362" r="6" />
    <circle cx="362" cy="476" r="6" /><circle cx="150" cy="476" r="6" />
    <circle cx="36" cy="362" r="6" /><circle cx="36" cy="150" r="6" />
  </g>

  <!-- Editorial Ribbon Label -->
  <g transform="translate(256, 442)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#020813" stroke="url(#ldsp-emerald)" stroke-width="1.5" />
    <text y="4" font-family="'Manrope', 'Inter', sans-serif" font-size="10" font-weight="800"
          letter-spacing="2" fill="#34D399" text-anchor="middle">
      DIGITAL SIGNAL PROCESSING &amp; ALGORITHMS
    </text>
  </g>
</svg>