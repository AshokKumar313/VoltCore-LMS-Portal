<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="voltcore-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0B5"/>
      <stop offset="50%" stop-color="#00b884"/>
      <stop offset="100%" stop-color="#00693E"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041026"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Silicon Substrate Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-grad)" stroke="#00F0B5" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Corner Chip Pins / Reticles -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="4" x2="24" y2="8" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="4" x2="32" y2="8" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="4" x2="40" y2="8" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="4" x2="48" y2="8" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>

  <line x1="16" y1="56" x2="16" y2="60" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="56" x2="24" y2="60" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="32" y2="60" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="56" x2="40" y2="60" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="56" x2="48" y2="60" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>

  <line x1="4" y1="20" x2="8" y2="20" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="8" y2="32" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="44" x2="8" y2="44" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>

  <line x1="56" y1="20" x2="60" y2="20" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="32" x2="60" y2="32" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="44" x2="60" y2="44" stroke="#00F0B5" stroke-width="2" stroke-linecap="round"/>

  <!-- Inner Die Area -->
  <rect x="12" y="12" width="40" height="40" rx="8" fill="#020813" stroke="#00693E" stroke-width="1.5"/>

  <!-- High-Tech VoltCore Chevron & Lightning Node Glyph -->
  <path d="M22 20 L32 38 L42 20" stroke="url(#voltcore-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M32 28 L32 46" stroke="#00F0B5" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Core Micro-Die Beacon -->
  <circle cx="32" cy="20" r="2.5" fill="#00F0B5" filter="url(#glow)"/>
  <circle cx="22" cy="20" r="2" fill="#00F0B5"/>
  <circle cx="42" cy="20" r="2" fill="#00F0B5"/>
  <circle cx="32" cy="46" r="2" fill="#00F0B5"/>
</svg>

