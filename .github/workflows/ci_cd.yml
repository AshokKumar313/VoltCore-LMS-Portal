name: VoltCore Apex Academia CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ========================================================================================
  # Job 1: Backend Security, Cryptography, RAG & Content QA Tests
  # ========================================================================================
  backend-tests:
    name: Backend Security, Curriculum RAG & QA Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov dulwich

      - name: Run Pytest Suite Across All Phases
        run: |
          pytest tests/ --verbose

      - name: Execute Content QA & Anti-Hallucination Audit
        run: |
          python scripts/content_qa_validator.py

      - name: Security & Privacy Environment Leakage Audit
        run: |
          echo "Verifying private admin credentials are not exposed in public client bundles..."
          if grep -rn "ashokkumar2008313@gmail.com" src/components/Topbar.astro; then
            echo "ERROR: Private admin email found hardcoded in Topbar!"
            exit 1
          fi
          if grep -rn "+91 9597382878" src/components/Topbar.astro; then
            echo "ERROR: Private admin phone found hardcoded in Topbar!"
            exit 1
          fi
          echo "Privacy audit passed: Private admin credentials safely isolated."

  # ========================================================================================
  # Job 2: Frontend Astro & React Production Build
  # ========================================================================================
  frontend-build:
    name: Astro & React Production Build
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Execute Astro Production Build
        run: npm run build

      - name: Verify All 22 Enterprise Static Routes
        run: |
          test -f dist/index.html || exit 1
          test -f dist/attendance/index.html || exit 1
          test -f dist/autograder/index.html || exit 1
          test -f dist/careers/index.html || exit 1
          test -f dist/collaboration/index.html || exit 1
          test -f dist/enterprise-admin/index.html || exit 1
          test -f dist/exam-center/index.html || exit 1
          test -f dist/flash-firmware/index.html || exit 1
          test -f dist/flashcards/index.html || exit 1
          test -f dist/fleet/index.html || exit 1
          test -f dist/gate-ece/index.html || exit 1
          test -f dist/hardware-hil/index.html || exit 1
          test -f dist/nptel/index.html || exit 1
          test -f dist/nptel-player/index.html || exit 1
          test -f dist/profile/index.html || exit 1
          test -f dist/research/index.html || exit 1
          test -f dist/settings/index.html || exit 1
          test -f dist/simulation/index.html || exit 1
          test -f dist/smart-lab/index.html || exit 1
          test -f dist/teacher/index.html || exit 1
          test -f dist/telemetry/index.html || exit 1
          test -f dist/virtual-bench/index.html || exit 1
          echo "All 22 enterprise production routes verified."

  # ========================================================================================
  # Job 3: Docker Composition & Container Spec Validation
  # ========================================================================================
  docker-validation:
    name: Docker Composition & Spec Validation
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Validate Dockerfile.api Syntax
        run: docker build -t voltcore-api:test -f Dockerfile.api .

